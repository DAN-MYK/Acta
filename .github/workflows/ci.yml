name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  frontend:
    name: Frontend build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check text encoding
        run: npm run check:encoding

      - name: Typecheck Svelte and TypeScript
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Run frontend store and component tests
        run: npm run test:frontend

  rust-backend:
    name: Rust backend legacy safety net
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Cargo check root crate
        run: cargo check -j 1

      - name: Run backend unit tests
        run: cargo test -j 1 --lib --test unit_business_logic

  sqlx-offline:
    name: SQLx offline metadata contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - rust-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acta_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acta_test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres --locked

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres -d acta_test && break
            sleep 2
          done

      - name: Seed demo database
        run: cargo run -j 1 --bin reseed

      - name: Verify SQLx offline metadata
        run: cargo sqlx prepare --check

  tauri-check:
    name: Tauri migration compile gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs:
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check Tauri crate
        run: cargo check -j 1 --manifest-path src-tauri/Cargo.toml

  db-integration:
    name: Postgres integration and Tauri vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - rust-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acta_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acta_test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres -d acta_test && break
            sleep 2
          done

      - name: Seed demo database
        run: cargo run -j 1 --bin reseed

      - name: Run DB integration tests
        run: cargo test -j 1 --test db_integration

      - name: Run Tauri vertical slice tests
        run: cargo test -j 1 --test tauri_vertical_slice
