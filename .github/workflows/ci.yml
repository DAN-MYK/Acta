name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks and vertical slice
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SQLX_OFFLINE: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acta_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acta_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres -d acta_test && break
            sleep 2
          done

      - name: Cargo check
        run: cargo check

      - name: Cargo build tests
        run: cargo build --tests

      - name: Seed demo database
        run: cargo run --bin reseed

      - name: Run Tauri vertical slice test
        run: cargo test --test tauri_vertical_slice

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test:frontend
